[project]
name = "focos-calor-peru"
version = "0.1.0"
description = "Focos de calor de NASA FIRMS cruzados con rasters de clima y luces nocturnas, por distrito del Perú"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "rasterio>=1.3",
  "rasterstats>=0.21.0",
  "matplotlib>=3.8",
  "earthengine-api>=1.7.49",
  "truststore>=0.10.5",
]

[dependency-groups]
dev = ["jupyterlab>=4", "ipykernel>=6.29", "nbstripout>=0.7", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "focos"
